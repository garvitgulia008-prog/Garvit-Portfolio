      function PortfolioApp() {
        const [isDark, setIsDark] = useState(() => {
          const saved = localStorage.getItem('theme');
          if (saved) return saved === 'dark';
          return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        });

        const [activeSection, setActiveSection] = useState('home');
        const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
        const [scrolled, setScrolled] = useState(false);
        const [scrollProgress, setScrollProgress] = useState(0);
        const [toast, setToast] = useState(null);

        // Project and Skill States

        const [activeAchievementTab, setActiveAchievementTab] = useState('All');
        const [selectedProject, setSelectedProject] = useState(null);
        const [copiedEmail, setCopiedEmail] = useState(false);

        // Contact Form State
        const [contactForm, setContactForm] = useState({ name: '', email: '', subject: '', message: '' });
        const [isSubmitting, setIsSubmitting] = useState(false);

        useEffect(() => {
          const root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            localStorage.setItem('theme', 'dark');
          } else {
            root.classList.remove('dark');
            localStorage.setItem('theme', 'light');
          }
        }, [isDark]);

        useEffect(() => {
          const handleScroll = () => {
            setScrolled(window.scrollY > 20);

            const current = window.scrollY;
            const total = document.documentElement.scrollHeight - window.innerHeight;
            if (total > 0) setScrollProgress((current / total) * 100);

            const sections = ['home', 'about', 'education', 'skills', 'projects', 'achievements', 'contact'];
            const scrollPos = window.scrollY + 140;
            for (let i = sections.length - 1; i >= 0; i--) {
              const el = document.getElementById(sections[i]);
              if (el && el.offsetTop <= scrollPos) {
                setActiveSection(sections[i]);
                break;
              }
            }
          };

          window.addEventListener('scroll', handleScroll, { passive: true });
          return () => window.removeEventListener('scroll', handleScroll);
        }, []);

        const scrollToSection = (e, id) => {
          if (e) e.preventDefault();
          setMobileMenuOpen(false);
          const el = document.getElementById(id);
          if (el) {
            const top = el.getBoundingClientRect().top + window.pageYOffset - 75;
            window.scrollTo({ top, behavior: 'smooth' });
            setActiveSection(id);
          }
        };

        const showToastMessage = (msg, type = 'success') => {
          setToast({ msg, type });
          setTimeout(() => setToast(null), 3500);
        };

        const handleCopy = () => {
          navigator.clipboard.writeText(personalInfo.email);
          setCopiedEmail(true);
          showToastMessage('Email address copied to clipboard!');
          setTimeout(() => setCopiedEmail(false), 2500);
        };

        const handleFormSubmit = (e) => {
          e.preventDefault();
          if (!contactForm.name || !contactForm.email || !contactForm.message) {
            showToastMessage('Please fill in all required fields.', 'error');
            return;
          }
          setIsSubmitting(true);
          setTimeout(() => {
            setIsSubmitting(false);
            showToastMessage(`Thank you, ${contactForm.name}! Your message was simulated successfully.`);
            setContactForm({ name: '', email: '', subject: '', message: '' });
          }, 800);
        };

          ? skillsData
          : skillsData.filter(s => s.category === activeSkillCategory);

          ? achievementsData
          : achievementsData.filter(a => a.type === activeAchievementTab);

                  <XIcon />

                      className="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-indigo-600 hover:text-white transition-all ml-2 cursor-pointer shadow-sm"
                    >
                      <ArrowUpIcon />
                    </button>
                  </div>
                </div>

                <div className="mt-8 pt-8 border-t border-slate-100 dark:border-slate-800 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-slate-400">
                  <div>&copy; {new Date().getFullYear()} {personalInfo.name}. All rights reserved. Built with React & Tailwind CSS.</div>
                  <div>Designed for Vercel & Modern Browsers</div>
                </div>
              </div>
            </footer>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<PortfolioApp />);
    </script>
  </body>
